<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-IO Transactions | Singularity.io</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .header {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .header h1 { color: #dc2626; font-size: 2.5rem; margin-bottom: 0.5rem; }
        .balance-card {
            background: rgba(220,38,38,0.1);
            border: 1px solid #dc2626;
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem 0;
            text-align: center;
        }
        .balance-amount { font-size: 2rem; font-weight: bold; color: #00ff88; }
        .balance-label { color: #ccc; margin-bottom: 0.5rem; }
        .wallet-info {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
        }
        .wallet-address { font-family: monospace; color: #dc2626; word-break: break-all; }
        .transactions-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 2rem;
        }
        .transactions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .transactions-header h2 { color: #dc2626; }
        .refresh-btn {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .transaction-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .transaction-item:hover { background: rgba(255,255,255,0.05); }
        .transaction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .transaction-type {
            background: rgba(220,38,38,0.2);
            color: #dc2626;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .transaction-amount {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ff88;
        }
        .transaction-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .detail-label { color: #888; }
        .detail-value { color: #fff; font-family: monospace; }
        .status-confirmed { color: #00ff88; }
        .status-pending { color: #ffaa00; }
        .status-failed { color: #ff4444; }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #888;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #888;
        }
        .connect-wallet-btn {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 1rem 2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 1rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #dc2626; }
        .stat-label { color: #888; font-size: 0.9rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1>📊 S-IO Transaction History</h1>
            </a>
            <p>Track your S-IO token transactions and balance</p>
            
            <div id="walletSection">
                <button class="connect-wallet-btn" onclick="connectWallet()">Connect Wallet</button>
            </div>
        </div>

        <div id="dashboardContent" style="display: none;">
            <div class="balance-card">
                <div class="balance-label">Current S-IO Balance</div>
                <div class="balance-amount" id="sioBalance">0.00</div>
            </div>

            <div class="wallet-info">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Wallet Address:</span>
                    <span class="wallet-address" id="walletAddress"></span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalTransactions">0</div>
                    <div class="stat-label">Total Transactions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalSpent">0.00</div>
                    <div class="stat-label">Total Spent (S-IO)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalReceived">0.00</div>
                    <div class="stat-label">Total Received (S-IO)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="lastTransaction">Never</div>
                    <div class="stat-label">Last Transaction</div>
                </div>
            </div>

            <div class="transactions-card">
                <div class="transactions-header">
                    <h2>Recent Transactions</h2>
                    <button class="refresh-btn" onclick="loadTransactions()">Refresh</button>
                </div>
                
                <div id="transactionsList">
                    <div class="loading">Loading transactions...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let walletAddress = '';

        async function connectWallet() {
            if (!window.solana?.isPhantom) { alert('Install Phantom Wallet'); return; }
            try {
                const resp = await window.solana.connect();
                walletAddress = resp.publicKey.toString();
                onConnect();
            } catch (e) { alert('Connection failed: ' + e.message); }
        }

        function onConnect() {
            document.getElementById('walletAddress').textContent = walletAddress;
            document.getElementById('walletSection').innerHTML = `<div style="color:#00ff88;margin-top:1rem">✅ Connected: ${walletAddress.slice(0,8)}...${walletAddress.slice(-8)}</div>`;
            document.getElementById('dashboardContent').style.display = 'block';
            loadBalance();
            loadTransactions();
        }

        function loadBalance() {
            const cached = window._cachedBalances;
            if (cached) {
                document.getElementById('sioBalance').textContent = cached.sio.toLocaleString(undefined, { maximumFractionDigits: 2 });
            } else {
                window.loadWalletBalances?.(walletAddress);
                window.addEventListener('balanceUpdated', (e) => {
                    document.getElementById('sioBalance').textContent = e.detail.sio.toLocaleString(undefined, { maximumFractionDigits: 2 });
                }, { once: true });
            }
        }

        function loadTransactions() {
            const txs = [];

            // Payment transactions
            const payments = JSON.parse(localStorage.getItem(`sio-payments-${walletAddress}`) || '[]');
            payments.forEach(p => txs.push({ type: 'PAYMENT', service: p.service || 'Service', amount: p.amount || 0, status: p.status || 'confirmed', timestamp: p.timestamp || Date.now(), sig: p.signature || null, desc: p.description || '' }));

            // Swap history
            const swaps = JSON.parse(localStorage.getItem('recent-swaps') || '[]');
            swaps.slice(0, 5).forEach(s => txs.push({ type: 'SWAP', service: `${s.from} → ${s.to}`, amount: 0, status: 'confirmed', timestamp: new Date().getTime() - Math.random() * 86400000, sig: s.signature, desc: 'Token swap via Jupiter' }));

            // Bot trades
            const botTrades = JSON.parse(localStorage.getItem('bot-trades') || '[]');
            botTrades.slice(0, 5).forEach(t => txs.push({ type: t.type || 'TRADE', service: 'AI Bot Trade', amount: 0, status: t.sig ? 'confirmed' : 'simulated', timestamp: new Date().getTime() - Math.random() * 86400000, sig: t.sig, desc: t.details || '' }));

            // Sort by timestamp desc
            txs.sort((a, b) => b.timestamp - a.timestamp);

            updateStats(txs);
            renderTransactions(txs);
        }

        function updateStats(txs) {
            const totalSpent = txs.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);
            document.getElementById('totalTransactions').textContent = txs.length;
            document.getElementById('totalSpent').textContent = totalSpent.toFixed(2);
            document.getElementById('totalReceived').textContent = '0.00';
            document.getElementById('lastTransaction').textContent = txs.length > 0 ? new Date(txs[0].timestamp).toLocaleDateString() : 'Never';
        }

        function renderTransactions(txs) {
            const el = document.getElementById('transactionsList');
            if (!txs.length) {
                el.innerHTML = '<div class="empty-state"><h3>No transactions yet</h3><p>Your S-IO activity will appear here</p></div>';
                return;
            }
            el.innerHTML = txs.map(tx => `
                <div class="transaction-item">
                    <div class="transaction-header">
                        <div class="transaction-type">${tx.type}</div>
                        ${tx.amount > 0 ? `<div class="transaction-amount">-${tx.amount.toLocaleString()} S-IO</div>` : '<div class="transaction-amount" style="color:#888">—</div>'}
                    </div>
                    <div class="transaction-details">
                        <div class="detail-item"><span class="detail-label">Service</span><span class="detail-value">${tx.service}</span></div>
                        <div class="detail-item"><span class="detail-label">Status</span><span class="detail-value status-${tx.status}">${tx.status.toUpperCase()}</span></div>
                        <div class="detail-item"><span class="detail-label">Date</span><span class="detail-value">${new Date(tx.timestamp).toLocaleString()}</span></div>
                        <div class="detail-item"><span class="detail-label">Description</span><span class="detail-value">${tx.desc || '—'}</span></div>
                    </div>
                    ${tx.sig ? `<div style="margin-top:.75rem"><a href="https://solscan.io/tx/${tx.sig}" target="_blank" style="color:#60a5fa;font-size:.8rem">View on Solscan ↗</a></div>` : ''}
                </div>`).join('');
        }

        function formatAddress(a) { return a ? `${a.slice(0,8)}...${a.slice(-8)}` : ''; }

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.solana?.isPhantom) {
                try {
                    const r = await window.solana.connect({ onlyIfTrusted: true });
                    walletAddress = r.publicKey.toString();
                    onConnect();
                } catch {}
            }
        });
    </script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="wallet-balance-loader.js"></script>
    <script src="wallet-manager.js"></script>
</body>
</html>
