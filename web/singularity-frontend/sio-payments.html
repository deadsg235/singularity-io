<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-IO Payment Gateway | Singularity.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        .payments-page { max-width: 1200px; margin: 2rem auto; }
        .payments-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        @media (max-width: 768px) { .payments-grid { grid-template-columns: 1fr; } }
        .panel {
            background: rgba(15,15,15,0.92);
            border: 1px solid rgba(220,38,38,0.4);
            border-radius: 12px;
            padding: 1.75rem;
            backdrop-filter: blur(10px);
        }
        .panel h2 { font-family: 'Orbitron', sans-serif; color: #dc2626; margin-bottom: 1.5rem; font-size: 1.1rem; }
        .balance-box {
            background: rgba(220,38,38,0.08);
            border: 1px solid rgba(220,38,38,0.3);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .balance-box .label { color: #888; font-size: 0.85rem; margin-bottom: 0.25rem; }
        .balance-box .amount { color: #00ff88; font-size: 1.4rem; font-weight: bold; font-family: 'Orbitron', sans-serif; }
        .service-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(220,38,38,0.25);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .service-item:hover { border-color: #dc2626; background: rgba(220,38,38,0.08); }
        .service-item.selected { border-color: #dc2626; background: rgba(220,38,38,0.15); }
        .service-item .svc-name { font-weight: bold; color: #dc2626; font-size: 0.9rem; }
        .service-item .svc-price { color: #00ff88; font-weight: bold; font-size: 0.85rem; margin-top: 0.25rem; }
        .service-item .svc-desc { color: #aaa; font-size: 0.8rem; margin-top: 0.25rem; }
        .pay-btn {
            width: 100%;
            padding: 1rem;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }
        .pay-btn:hover { background: #b91c1c; }
        .pay-btn:disabled { background: #444; cursor: not-allowed; }
        .tx-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(220,38,38,0.2);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .tx-header { display: flex; justify-content: space-between; align-items: center; }
        .tx-service { font-weight: bold; color: #dc2626; font-size: 0.9rem; }
        .tx-amount { color: #00ff88; font-weight: bold; }
        .tx-time { color: #666; font-size: 0.8rem; margin-top: 0.4rem; }
        .tx-sig a { color: #60a5fa; font-size: 0.75rem; }
        .msg { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
        .msg.success { background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
        .msg.error { background: rgba(255,68,68,0.1); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div>
                    <h1 class="logo">SINGULARITY<span>.io</span></h1>
                    <p class="tagline">S-IO Payment Gateway</p>
                </div>
                <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                    <a href="index.html" class="header-link" style="color:#dc2626;">Home</a>
                    <a href="services.html" class="header-link" style="color:#dc2626;">Services</a>
                    <button id="wallet-btn" class="wallet-btn">Connect Wallet</button>
                    <div id="balance-display" class="balance-display hidden">
                        <div class="balance-item">
                            <span class="balance-label">SOL</span>
                            <span id="sol-balance">0</span>
                        </div>
                        <div class="balance-item">
                            <span class="balance-label">S-IO</span>
                            <span id="sio-balance">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="payments-page">
            <div class="payments-grid">
                <!-- Left: Services -->
                <div class="panel">
                    <h2>🛒 Available Services</h2>
                    <div class="balance-box">
                        <div class="label">S-IO Balance</div>
                        <div class="amount" id="sio-balance-display">—</div>
                    </div>
                    <div id="msg-container"></div>
                    <div id="services-list"></div>
                    <button class="pay-btn" id="pay-btn" disabled>Connect Wallet First</button>
                </div>

                <!-- Right: Transaction History -->
                <div class="panel">
                    <h2>📋 Transaction History</h2>
                    <div id="tx-list"><p style="color:#666">Connect wallet to view transactions</p></div>
                </div>
            </div>
        </div>

        <footer>
            <p>Singularity.io | S-IO Payment Gateway</p>
        </footer>
    </div>

    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="wallet-balance-loader.js"></script>
    <script src="wallet-manager.js"></script>
    <script>
        const SIO_MINT_ADDR = 'Fuj6EDWQHBnQ3eEvYDujNQ4rPLSkhm3pBySbQ79Bpump';
        const TREASURY = 'Fuj6EDWQHBnQ3eEvYDujNQ4rPLSkhm3pBySbQ79Bpump'; // placeholder treasury

        const SERVICES = [
            { id: 'neural_network', name: '🧠 Neural Network Access', price: 100_000, duration: 30, description: 'AI neural network predictions and DQN analysis' },
            { id: 'premium_analytics', name: '📈 Premium Analytics', price: 250_000, duration: 30, description: 'Advanced market analytics and on-chain insights' },
            { id: 'ai_trading_signals', name: '🎯 AI Trading Signals', price: 500_000, duration: 30, description: 'Real-time Groq-powered trading signals' },
            { id: 'guardian_premium', name: '🛡️ Guardian Premium', price: 150_000, duration: 30, description: 'Advanced security monitoring and threat detection' },
            { id: 'bot_pro', name: '🤖 Bot Pro', price: 750_000, duration: 30, description: 'Unlimited bot deployments with AI strategy' },
            { id: 'enterprise', name: '🚀 Enterprise Suite', price: 2_500_000, duration: 30, description: 'Full platform access with dedicated support' }
        ];

        let walletPubkey = null;
        let selectedService = null;

        function txKey() { return walletPubkey ? 'sio-payments-' + walletPubkey : null; }

        function getTxHistory() {
            const k = txKey();
            if (!k) return [];
            try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; }
        }

        function saveTx(tx) {
            const k = txKey();
            if (!k) return;
            const history = getTxHistory();
            history.unshift(tx);
            localStorage.setItem(k, JSON.stringify(history.slice(0, 50)));
        }

        function renderServices() {
            document.getElementById('services-list').innerHTML = SERVICES.map(s =>
                '<div class="service-item' + (selectedService?.id === s.id ? ' selected' : '') + '" onclick="selectService(\'' + s.id + '\')">' +
                '<div class="svc-name">' + s.name + '</div>' +
                '<div class="svc-price">' + s.price.toLocaleString() + ' S-IO / ' + s.duration + ' days</div>' +
                '<div class="svc-desc">' + s.description + '</div>' +
                '</div>'
            ).join('');
        }

        function selectService(id) {
            selectedService = SERVICES.find(s => s.id === id);
            renderServices();
            const btn = document.getElementById('pay-btn');
            if (walletPubkey && selectedService) {
                btn.disabled = false;
                btn.textContent = 'Pay ' + selectedService.price.toLocaleString() + ' S-IO';
            }
        }

        function renderTxHistory() {
            const history = getTxHistory();
            const el = document.getElementById('tx-list');
            if (!history.length) { el.innerHTML = '<p style="color:#666">No transactions yet</p>'; return; }
            el.innerHTML = history.map(tx =>
                '<div class="tx-item">' +
                '<div class="tx-header"><span class="tx-service">' + tx.service + '</span><span class="tx-amount">-' + tx.amount.toLocaleString() + ' S-IO</span></div>' +
                '<div class="tx-time">' + new Date(tx.ts).toLocaleString() + '</div>' +
                (tx.sig ? '<div class="tx-sig"><a href="https://solscan.io/tx/' + tx.sig + '" target="_blank">View on Solscan ↗</a></div>' : '') +
                '</div>'
            ).join('');
        }

        function showMsg(text, type) {
            const c = document.getElementById('msg-container');
            c.innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
            setTimeout(() => c.innerHTML = '', 6000);
        }

        function updateBalanceDisplay() {
            const sio = window._cachedBalances?.sio ?? 0;
            document.getElementById('sio-balance-display').textContent = sio.toLocaleString() + ' S-IO';
        }

        window.addEventListener('balanceUpdated', updateBalanceDisplay);

        // SPL transfer helper (same pattern as staking.js)
        async function sendSplTransfer(fromPubkey, toPubkey, amount) {
            if (!window.solanaWeb3) throw new Error('Solana Web3 not loaded');
            const connection = new solanaWeb3.Connection('https://api.mainnet-beta.solana.com', 'confirmed');
            const from = new solanaWeb3.PublicKey(fromPubkey);
            const mint = new solanaWeb3.PublicKey(SIO_MINT_ADDR);
            const srcAccounts = await connection.getParsedTokenAccountsByOwner(from, { mint });
            if (!srcAccounts.value.length) throw new Error('No S-IO token account found');
            const srcAta = new solanaWeb3.PublicKey(srcAccounts.value[0].pubkey);
            const dest = new solanaWeb3.PublicKey(toPubkey);
            const [destAta] = await solanaWeb3.PublicKey.findProgramAddress(
                [dest.toBuffer(), new solanaWeb3.PublicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA').toBuffer(), mint.toBuffer()],
                new solanaWeb3.PublicKey('ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJe1bRS')
            );
            const decimals = 6;
            const rawAmount = BigInt(Math.floor(amount * Math.pow(10, decimals)));
            const buf = new Uint8Array(9);
            buf[0] = 3;
            new DataView(buf.buffer).setBigUint64(1, rawAmount, true);
            const transferIx = new solanaWeb3.TransactionInstruction({
                programId: new solanaWeb3.PublicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA'),
                keys: [
                    { pubkey: srcAta, isSigner: false, isWritable: true },
                    { pubkey: destAta, isSigner: false, isWritable: true },
                    { pubkey: from, isSigner: true, isWritable: false }
                ],
                data: buf
            });
            const { blockhash } = await connection.getLatestBlockhash();
            const tx = new solanaWeb3.Transaction({ recentBlockhash: blockhash, feePayer: from });
            tx.add(transferIx);
            const signed = await window.solana.signTransaction(tx);
            const sig = await connection.sendRawTransaction(signed.serialize(), { skipPreflight: false });
            await connection.confirmTransaction(sig, 'confirmed');
            return sig;
        }

        document.getElementById('pay-btn').addEventListener('click', async () => {
            if (!walletPubkey || !selectedService) { showMsg('Select a service and connect wallet', 'error'); return; }
            const sio = window._cachedBalances?.sio ?? 0;
            if (sio < selectedService.price) {
                showMsg('Insufficient S-IO. You have ' + sio.toLocaleString() + ', need ' + selectedService.price.toLocaleString(), 'error');
                return;
            }
            const btn = document.getElementById('pay-btn');
            btn.disabled = true; btn.textContent = 'Processing…';
            try {
                const sig = await sendSplTransfer(walletPubkey, TREASURY, selectedService.price);
                saveTx({ service: selectedService.name, amount: selectedService.price, ts: Date.now(), sig });
                showMsg('Payment confirmed! <a href="https://solscan.io/tx/' + sig + '" target="_blank" style="color:#60a5fa">View on Solscan ↗</a>', 'success');
                renderTxHistory();
                setTimeout(() => window.loadWalletBalances?.(walletPubkey), 3000);
            } catch (e) {
                showMsg('Payment failed: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = selectedService ? 'Pay ' + selectedService.price.toLocaleString() + ' S-IO' : 'Select Service';
            }
        });

        // Wallet connect
        document.getElementById('wallet-btn').addEventListener('click', async () => {
            if (walletPubkey) {
                await window.solana?.disconnect();
                walletPubkey = null;
                const btn = document.getElementById('wallet-btn');
                btn.textContent = 'Connect Wallet'; btn.classList.remove('connected');
                document.getElementById('balance-display')?.classList.add('hidden');
                document.getElementById('sio-balance-display').textContent = '—';
                document.getElementById('pay-btn').disabled = true;
                document.getElementById('pay-btn').textContent = 'Connect Wallet First';
                document.getElementById('tx-list').innerHTML = '<p style="color:#666">Connect wallet to view transactions</p>';
            } else {
                if (!window.solana?.isPhantom) { alert('Install Phantom Wallet'); return; }
                const resp = await window.solana.connect();
                walletPubkey = resp.publicKey.toString();
                const btn = document.getElementById('wallet-btn');
                btn.textContent = walletPubkey.slice(0,4) + '…' + walletPubkey.slice(-4);
                btn.classList.add('connected');
                document.getElementById('balance-display')?.classList.remove('hidden');
                window.loadWalletBalances?.(walletPubkey);
                if (selectedService) {
                    document.getElementById('pay-btn').disabled = false;
                    document.getElementById('pay-btn').textContent = 'Pay ' + selectedService.price.toLocaleString() + ' S-IO';
                } else {
                    document.getElementById('pay-btn').textContent = 'Select a Service';
                }
                renderTxHistory();
            }
        });

        // Auto-connect
        setTimeout(async () => {
            if (window.solana?.isPhantom) {
                try {
                    const r = await window.solana.connect({ onlyIfTrusted: true });
                    walletPubkey = r.publicKey.toString();
                    const btn = document.getElementById('wallet-btn');
                    btn.textContent = walletPubkey.slice(0,4) + '…' + walletPubkey.slice(-4);
                    btn.classList.add('connected');
                    document.getElementById('balance-display')?.classList.remove('hidden');
                    window.loadWalletBalances?.(walletPubkey);
                    document.getElementById('pay-btn').textContent = 'Select a Service';
                    renderTxHistory();
                } catch {}
            }
        }, 600);

        // Init
        renderServices();
    </script>
</body>
</html>
