[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dqn_core"
version = "2.0.0"
description = "5-Layer DQN Reasoning Engine for Singularity.io"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["dqn_core*"]

[tool.setuptools.package-dir]
"dqn_core" = "."
